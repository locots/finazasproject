<div class="login-container">
  <div class="row g-0 h-100">
    <!-- Columna izquierda: Formulario de login -->
    <div class="col-md-6">
      <div class="login-form-container">
        <div class="login-form-content">
          <div class="text-center mb-1">
            <img src="assets/img/logofin.png" alt="Sistema Financiero" class="login-logo">
            <h2 class="mt-0">Sistema de Remesas</h2>
          </div>
          
          <form (submit)="onLogin($event)">
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" placeholder="tu@correo.com" [(ngModel)]="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" required>
            </div>
            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="rememberMe" [(ngModel)]="rememberMe" name="rememberMe">
              <label class="form-check-label" for="rememberMe">Recordarme</label>
            </div>
            <div class="alert alert-danger" *ngIf="errorMessage">
              {{ errorMessage }}
            </div>
            <div class="d-grid">
              <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </div>
          </form>
          
          <div class="text-center mt-4">
            <p class="mb-0 small">© 2025 Sistema de Remesas para Iglesias</p>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Columna derecha: Imagen de fondo y mensaje -->
    <div class="col-md-6 d-none d-md-block">
      <div class="login-image-container">
        <div class="login-image-content">
          <h2 class="text-white display-4 fw-bold">Sistema Financiero</h2>
          <p class="text-white lead">Administra los diezmos y ofrendas de tu iglesia de manera eficiente.</p>
        </div>
      </div>
    </div>
  </div>
</div>
